<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will You Be My Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <main class="card">
    <div class="badge">Official question</div>
    <h1 class="script">Will you be my forever Valentine, baby?</h1>
    <p class="lead">Choose wisely... because my heart is very persistent.</p>

    <div class="button-row" id="buttonRow">
      <button id="yesBtn" class="btn primary big" type="button">Yes</button>
      <button id="noBtn" class="btn ghost" type="button">No</button>
    </div>

    <div class="status" id="status" aria-live="polite"></div>
    <p class="tiny">(If you press “No”, the “Yes” button will grow until it becomes impossible to resist.)</p>

    <div class="actions">
      <a class="btn link" href="index.html">Back</a>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="ask.js"></script>
</body>
</html>
